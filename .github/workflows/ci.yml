name: Squid Protocol CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: squid_user
          POSTGRES_PASSWORD: squid_secret
          POSTGRES_DB: squid_protocol_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Typecheck Backend & Frontend
        run: npm run typecheck

      - name: Setup Database Schema
        env:
          DATABASE_URL: postgresql://squid_user:squid_secret@localhost:5432/squid_protocol_test?schema=public
        run: |
          npx prisma db push --schema backend/prisma/schema.prisma --accept-data-loss
          npx tsx backend/prisma/seed.ts

      - name: Run Complete Test Suite
        env:
          DATABASE_URL: postgresql://squid_user:squid_secret@localhost:5432/squid_protocol_test?schema=public
          TEST_DATABASE_URL: postgresql://squid_user:squid_secret@localhost:5432/squid_protocol_test?schema=public
          SESSION_SECRET: ci-testing-session-secret-key-32chars
          JWT_SECRET: ci-testing-jwt-secret-key-32chars
        run: npm test

      - name: Build Backend & Frontend
        run: npm run build
